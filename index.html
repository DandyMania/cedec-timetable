<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>CEDEC 2026 講演検索</title>
<meta name="description" content="CEDEC 2026 のセッションをスマホで探すための非公式ビューア。オフラインでも開けて、話し言葉で検索できます。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header class="appbar">
  <div class="appbar__row">
    <button type="button" class="iconbtn" id="btn-menu" aria-expanded="false"
            aria-label="メニュー">≡</button>
    <h1 class="appbar__title">CEDEC 2026 講演検索</h1>
    <div class="appbar__actions">
      <div class="segmented" role="group" aria-label="表示の切り替え">
        <button type="button" class="segmented__btn" id="btn-view-list"
                aria-pressed="true" aria-label="リストで見る" title="リスト表示">☰</button>
        <button type="button" class="segmented__btn" id="btn-view-compact"
                aria-pressed="false" aria-label="コンパクトに見る" title="コンパクト表示（1行）">▤</button>
        <button type="button" class="segmented__btn" id="btn-view" aria-pressed="false"
                aria-label="表（タイムテーブル）で見る" title="タイムテーブル表示（会場×時刻）">▦</button>
      </div>
    </div>
  </div>
  <div class="menu" id="menu" hidden>
    <div class="menu__sep">表示テーマ</div>
    <div class="menu__years">
      <div class="segmented segmented--wide" role="group" aria-label="表示テーマ">
        <button type="button" class="segmented__btn" data-theme-set="" aria-pressed="true">システム</button>
        <button type="button" class="segmented__btn" data-theme-set="light" aria-pressed="false">ライト</button>
        <button type="button" class="segmented__btn" data-theme-set="dark" aria-pressed="false">ダーク</button>
      </div>
    </div>
    <div class="menu__sep">開催年</div>
    <div class="menu__years" id="menu-years"></div>
    <div class="menu__sep">公式</div>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/timetable/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>公式タイムテーブル</a>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>CEDEC 2026 公式サイト</a>
    <a class="menu__item menu__item--strong" href="https://cedec.cesa.or.jp/2026/map/" target="_blank" rel="noopener">
      <span class="menu__icon">🗺</span>フロアマップ</a>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/access/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>会場アクセス（パシフィコ横浜）</a>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/event/awards/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>CEDEC AWARDS</a>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/interactive/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>インタラクティブセッション</a>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/event/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>併催イベント</a>
    <a class="menu__item" href="https://cedil.cesa.or.jp/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>CEDiL（講演資料）</a>
    <div class="menu__sep">その他</div>
    <a class="menu__item" href="https://kazunori-toybox.com/cedec_schedule/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>CEDEC非公式タイムテーブル</a>
    <a class="menu__item" href="https://x.com/search?q=%23CEDEC2026&f=live" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>#CEDEC2026 の投稿</a>
    <a class="menu__item" href="https://github.com/DandyMania/cedec-timetable" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>このページのソース</a>
    <button type="button" class="menu__item" id="menu-about">
      <span class="menu__icon">ⓘ</span>このページについて</button>
    <div class="menu__note" id="menu-note"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="表示する日"></nav>
  <div class="offline" id="offline" hidden>オフラインで表示中（保存済みのデータ）</div>
</header>

<div class="filters" id="filters" hidden></div>

<main id="list" class="list" aria-live="polite"></main>

<div class="fabs">
  <button type="button" class="fab fab--primary fab--now" id="btn-now" aria-label="今の時間へ" hidden>今</button>
  <button type="button" class="fab fab--round" id="btn-prev" aria-label="前の時間帯へ">∧</button>
  <button type="button" class="fab fab--round" id="btn-next" aria-label="次の時間帯へ">∨</button>
  <button type="button" class="fab fab--round" id="btn-top" aria-label="一番上へ">↑</button>
</div>

<div class="bottombar">
  <div class="bottombar__row">
    <div class="search">
      <span class="search__icon" aria-hidden="true">🔍</span>
      <input type="search" id="q" class="search__input" enterkeyhint="search"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="キーワード・登壇者・会社名"
             aria-label="セッションを検索">
      <button type="button" class="search__clear" id="btn-clear" aria-label="検索をクリア" hidden>✕</button>
    </div>
    <button type="button" class="bottombar__btn" id="btn-filters-float"
            aria-label="絞り込み" title="絞り込み（カテゴリ・会場・キーワード）">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M3 5h18l-7 8v6l-4 2v-8L3 5z" fill="currentColor"/>
      </svg></button>
    <button type="button" class="bottombar__btn" id="btn-fav-bottom" aria-pressed="false"
            aria-label="マイプラン" title="マイプラン（★を付けた講演）">★<span
            class="bottombar__badge" id="fav-count-bottom">0</span></button>
  </div>
  <div class="filterbar" hidden><div id="status" role="status"></div></div>
</div>


<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <article class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__body" id="sheet-body"></div>
  </article>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
