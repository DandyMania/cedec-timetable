<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>CEDEC 2026 講演検索</title>
<meta name="description" content="CEDEC 2026 のセッションをスマホで探すための非公式ビューア。オフラインでも開けて、話し言葉で検索できます。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header class="appbar">
  <div class="appbar__row">
    <h1 class="appbar__title">CEDEC 2026 講演検索</h1>
    <div class="appbar__actions">
      <button type="button" class="iconbtn" id="btn-menu" aria-expanded="false"
              aria-label="メニュー">≡</button>
    </div>
  </div>
  <div class="menu" id="menu" hidden>
    <button type="button" class="menu__item" id="btn-view" aria-pressed="false">
      <span class="menu__icon">▦</span>表で見る（会場ごとのタイムテーブル）</button>
    <button type="button" class="menu__item" id="menu-filters">
      <span class="menu__icon">⛃</span>絞り込み・キーワード</button>
    <a class="menu__item" href="https://cedec.cesa.or.jp/2026/timetable/" target="_blank" rel="noopener">
      <span class="menu__icon">↗</span>公式タイムテーブル</a>
    <div class="menu__note" id="menu-note"></div>
  </div>
  <div class="filterbar">
    <div class="filterbar__status" id="status" role="status"></div>
  </div>
  <div class="offline" id="offline" hidden>オフラインで表示中（保存済みのデータ）</div>
</header>

<div class="filters" id="filters" hidden></div>

<main id="list" class="list" aria-live="polite"></main>

<button type="button" class="fab fab--primary" id="btn-now" hidden>now</button>

<div class="bottombar">
  <div class="search">
    <span class="search__icon" aria-hidden="true">🔍</span>
    <input type="search" id="q" class="search__input" enterkeyhint="search"
           autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="話し言葉でOK（例: AIで開発を効率化する話）"
           aria-label="セッションを検索">
    <button type="button" class="search__clear" id="btn-clear" aria-label="検索をクリア" hidden>✕</button>
  </div>
  <nav class="bottombar__row" aria-label="表示する日">
    <div class="tabs" id="tabs"></div>
    <button type="button" class="bottombar__btn" id="btn-fav-bottom" aria-pressed="false"
            aria-label="マイプラン">★<span class="bottombar__badge" id="fav-count-bottom">0</span></button>
    <button type="button" class="bottombar__btn" id="btn-filters-float" aria-label="絞り込み">⛃</button>
  </nav>
</div>

<footer class="foot">
  <p id="foot-meta"></p>
  <p class="foot__note">
    非公式のビューアです。セッション情報は
    <a href="https://cedec.cesa.or.jp/2026/" target="_blank" rel="noopener">CEDEC 2026 公式</a>
    が配布するデータを取り込んでいます。会場（部屋番号）は
    <a href="https://kazunori-toybox.com/cedec_schedule/" target="_blank" rel="noopener">CEDEC非公式タイムテーブル</a>
    のデータを利用しています。
  </p>
</footer>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <article class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__body" id="sheet-body"></div>
  </article>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
